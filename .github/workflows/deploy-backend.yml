name: Deploy Backend (Render)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
